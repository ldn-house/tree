<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tree effects viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; --bg: #07090d; --panel: #10141b; --line: #222a36; --text: #d8dee9; --dim: #7d8899; --accent: #6fd08c; --warn: #f0a050; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 300px; background: var(--bg); color: var(--text); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
    #stage { position: relative; overflow: hidden; }
    #stage canvas { display: block; }
    #status { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; pointer-events: none; white-space: pre; }
    #views { position: absolute; left: 12px; top: 10px; display: flex; gap: 4px; }
    aside { background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; }
    h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 18px 0 8px; font-weight: 600; }
    label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 8px 0; }
    label input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
    label output { color: var(--dim); font-variant-numeric: tabular-nums; }
    select, button { background: #182029; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
    select { width: 100%; }
    button { cursor: pointer; }
    button.on { border-color: var(--accent); color: var(--accent); }
    .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
    .meter { height: 10px; background: #182029; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
    .meter > div { height: 100%; width: 0; background: var(--accent); transition: width .1s; }
    .meter.capped > div { background: var(--warn); }
    #cap { font-weight: 600; padding: 1px 6px; border-radius: 4px; font-size: 11px; }
    #cap.on { background: var(--warn); color: #000; }
    #cap.off { background: #182029; color: var(--dim); }
    .note { color: var(--dim); font-size: 12px; }
    #error { color: #ff7070; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="stage">
    <div id="views">
      <button data-view="front">Front</button>
      <button data-view="side">Side</button>
      <button data-view="top">Top</button>
      <button id="spin">Spin</button>
    </div>
    <div id="status">Loading Pyodide…</div>
  </div>
  <aside>
    <h1>Tree effects</h1>
    <select id="effect" disabled></select>
    <div class="row">
      <button id="restart">Restart</button>
      <label style="margin:0;display:flex;gap:6px;align-items:center">seed <input id="seed" type="number" value="0" style="width:60px;background:#182029;color:inherit;border:1px solid var(--line);border-radius:6px;padding:4px"></label>
      <button id="raw" title="Show the raw effect frame instead of the output stage">Raw</button>
    </div>
    <div id="params"></div>

    <h2>Output</h2>
    <label>Brightness <output id="bri-out"></output><input id="bri" type="range" min="0" max="255" value="255"></label>
    <label title="u'v' drift allowed above the colour floor (effects/_output.py); 0 is off">Colour accuracy <output id="acc-out"></output><input id="acc" type="range" min="0" max="0.05" step="0.001" value="0.01"></label>
    <label>Current limit <output id="limit-out"></output><input id="limit" type="range" min="0.2" max="5" step="0.1" value="1.5"></label>

    <h2>Power <span id="cap" class="off">CAP</span></h2>
    <div class="meter" id="meter"><div></div></div>
    <div class="row note" id="power"></div>

    <h2>Files</h2>
    <div class="note" id="files"></div>
    <div id="error"></div>
  </aside>
  <script type="module" src="main.js"></script>
</body>
</html>
