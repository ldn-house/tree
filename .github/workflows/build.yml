name: Firmware

# Builds and tests the firmware on every PR. Publishes it as GitHub Release
# assets (which do not expire, unlike workflow artifacts) only for trusted refs
# of this repository:
#   push to main      -> rolling prerelease "firmware-main" (channel "main")
#   push of tag v*    -> release vX.Y.Z (channel "stable": releases/latest)
# Pull requests (including from forks) build and test but never publish or
# see the signing key.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      shards:
        description: "Firmware test shards (1 runs the suite serially, e.g. to time it)"
        default: "4"

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks. Pushes to main
# and tags (which publish releases) get a group of their own and never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MICROPYTHON_VERSION: v1.27.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Compile-check the recovery layer
        # Installed over USB only; mpy-cross catches syntax errors.
        run: |
          for f in firmware/*.py; do
            uvx --from mpy-cross==1.27.0.post2 mpy-cross -o /dev/null "$f"
          done

      - name: Build bundle (mpy-cross compiles every module)
        env:
          # Only trusted pushes may sign; PRs get an unsigned test bundle.
          FIRMWARE_SIGNING_KEY: ${{ github.event_name == 'push' && github.repository == 'ldn-house/tree' && secrets.FIRMWARE_SIGNING_KEY || '' }}
        run: |
          uv run tools/build_firmware.py --out dist
          python3 -c "import json; m = json.load(open('dist/manifest.json')); print(m['version'], m['ref'], len(m['files']), 'files')"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          retention-days: 14  # for inspecting PRs; devices use Releases

  # Which firmware tests to run. A pull request that changes only effects/
  # (plus renders and docs) can only break the tests that bundle the repo's
  # effects; anything else, and every push, tag or manual run, gets the full
  # suite. Decided here rather than with workflow-level `paths`, so the
  # required check below always reports.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify the change
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mode=full
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # One record per changed file; a rename counts its old path too
            # (moving a test out of tests/ is not an effects-only change).
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename + "\t" + (.previous_filename // "")' > files.tsv
            tr '\t' '\n' < files.tsv | sed '/^$/d' > changed.txt
            echo "Changed files:"; cat changed.txt
            # The API lists at most 3000 files; at that size, run everything.
            if [ "$(wc -l < files.tsv)" -lt 3000 ] && ! grep -Ev '^(effects/|renders/|docs/)|^[^/]+\.md$' changed.txt >/dev/null; then
              mode=effects
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Firmware tests: $mode" >> "$GITHUB_STEP_SUMMARY"
      - name: Plan the shards
        id: matrix
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 tests/firmware/shards.py "$MODE" "${SHARDS:-4}" > matrix.json
          cat matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  firmware-tests:
    needs: changes
    name: firmware tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4  # shallow: older firmware the tests compare with is vendored (tests/firmware/fixtures/history)
      - uses: astral-sh/setup-uv@v6

      - name: Install mosquitto
        # Each shard runs its own brokers (the fixtures pick free ports).
        run: sudo apt-get update && sudo apt-get install -y mosquitto && sudo systemctl stop mosquitto || true

      - name: Cache the MicroPython unix port
        id: mp-cache
        uses: actions/cache@v4
        with:
          path: ~/micropython-bin
          key: micropython-unix-${{ env.MICROPYTHON_VERSION }}-32bit

      - name: Build the MicroPython unix port
        if: steps.mp-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MICROPYTHON_VERSION" https://github.com/micropython/micropython /tmp/mp
          make -C /tmp/mp/mpy-cross -j"$(nproc)"
          make -C /tmp/mp/ports/unix submodules
          make -C /tmp/mp/ports/unix -j"$(nproc)"
          mkdir -p ~/micropython-bin
          cp /tmp/mp/ports/unix/build-standard/micropython ~/micropython-bin/
          # 32-bit build: objects the size they are on the RP2350, for the
          # board-sized heap test (tests/firmware/test_heap.py).
          sudo apt-get install -y gcc-multilib
          make -C /tmp/mp/ports/unix MICROPY_FORCE_32BIT=1 MICROPY_PY_FFI=0 BUILD=build-32 -j"$(nproc)"
          cp /tmp/mp/ports/unix/build-32/micropython ~/micropython-bin/micropython32

      - name: Firmware tests (unix port, simulated hardware, local broker)
        env:
          MOSQUITTO: /usr/sbin/mosquitto
          FILES: ${{ matrix.files }}
        run: |
          export MICROPYTHON="$HOME/micropython-bin/micropython"
          export MICROPYTHON32="$HOME/micropython-bin/micropython32"
          uv run --with pytest --with paho-mqtt --with mpy-cross==1.27.0.post2 pytest $FILES -q --durations=25

  # The required check: passes only if every shard ran and passed. (A job
  # named "test" in another workflow, such as calibration.yml's, must not be
  # able to stand in for the firmware tests.)
  firmware-test:
    needs: [changes, firmware-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.firmware-tests.result }}
        run: |
          echo "mode: $MODE, changes: $CHANGES, shards: $SHARDS"
          [ "$CHANGES" = success ] && [ "$SHARDS" = success ]

  web-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Test web export and renderer parity
        run: |
          if ! git check-ignore -q .scratch; then
            printf '\n.scratch/\n' >> "$(git rev-parse --git-path info/exclude)"
          fi
          mkdir -p .scratch
          uv run --python 3.12 --with pytest --with numpy --with pillow \
            python -m pytest tests/test_web_export.py --basetemp=.scratch/web-export-tests -q

      - name: Export web loops and decode their contact sheet
        run: |
          uv run --python 3.12 export_web.py --out renders/web \
            --archive renders/tree-effects.tar.gz --sheet renders/web-sheet.png

      - uses: actions/upload-artifact@v4
        with:
          name: tree-web
          path: |
            renders/tree-effects.tar.gz
            renders/web-sheet.png
          retention-days: 14

  publish:
    needs: [build, firmware-test]
    if: github.repository == 'ldn-house/tree' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-firmware
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Publish rolling "main" prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f firmware-main "$GITHUB_SHA"
          git push -f origin refs/tags/firmware-main
          notes="Rolling build of main at ${GITHUB_SHA::7}. Devices on channel \"main\" install this."
          if gh release view firmware-main >/dev/null 2>&1; then
            gh release edit firmware-main --prerelease --notes "$notes" --title "Firmware (main, ${GITHUB_SHA::7})"
          else
            gh release create firmware-main --prerelease --notes "$notes" --title "Firmware (main, ${GITHUB_SHA::7})"
          fi
          gh release upload firmware-main dist/tree-firmware.bin dist/manifest.json --clobber

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/tree-firmware.bin dist/manifest.json \
            --title "Firmware $GITHUB_REF_NAME" --generate-notes --verify-tag

  # Independent of firmware publication: a web export/test/upload failure
  # must never prevent the firmware assets above from shipping.
  publish-web:
    needs: [web-export, publish]
    if: github.repository == 'ldn-house/tree' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Never share firmware's queue: a new pending job can cancel an older
      # pending job even with cancel-in-progress disabled.
      group: publish-tree-web
      # Keep newer main uploads if an older run finishes prerequisites later.
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tree-web
          path: web-dist
      - name: Add the web archive to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Serialize web uploads separately (they touch only this asset).
          # Skip stale queued runs; source.commit identifies the web build
          # independently of firmware's moving release tag.
          main_sha=$(gh api repos/ldn-house/tree/git/ref/heads/main --jq .object.sha)
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            gh release upload firmware-main web-dist/tree-effects.tar.gz --clobber
          else
            echo "Skipping web upload: main now points to $main_sha"
          fi
